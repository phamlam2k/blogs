<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: light-dark(#FFFFFF, #121212); color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1060px" height="360px" viewBox="0 0 1060 360"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c1"><g><rect x="16" y="16" width="1000" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#24292F" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="516" y="42">One 4000 × 3000 phone photo, shown in a 400px-wide card</text></g></g></g><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="16" y="76" width="220" height="120" rx="14.4" ry="14.4" fill="#f6f8fa" stroke="#8c959f" pointer-events="all" style="fill: light-dark(rgb(246, 248, 250), rgb(23, 25, 27)); stroke: light-dark(rgb(140, 149, 159), rgb(103, 111, 120));"/></g><g><g fill="#24292F" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="126" y="124.5">photo.jpg</text><text x="126" y="142.5">4000 × 3000 px</text><text x="126" y="160.5">3 MB on disk</text></g></g></g><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><rect x="286" y="76" width="220" height="120" rx="14.4" ry="14.4" fill="#ffebe9" stroke="#cf222e" pointer-events="all" style="fill: light-dark(rgb(255, 235, 233), rgb(45, 28, 26)); stroke: light-dark(rgb(207, 34, 46), rgb(255, 143, 153));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="396" y="125">① Network</text><text x="396" y="142">Downloads all 3 MB</text><text x="396" y="159">(most pixels never shown)</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="556" y="76" width="220" height="120" rx="14.4" ry="14.4" fill="#ffebe9" stroke="#cf222e" pointer-events="all" style="fill: light-dark(rgb(255, 235, 233), rgb(45, 28, 26)); stroke: light-dark(rgb(207, 34, 46), rgb(255, 143, 153));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="666" y="125">② Memory</text><text x="666" y="142">Decoded: 4000 × 3000 × 4</text><text x="666" y="159">≈ 48 MB of RAM</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="826" y="76" width="200" height="120" rx="14.4" ry="14.4" fill="#ffebe9" stroke="#cf222e" pointer-events="all" style="fill: light-dark(rgb(255, 235, 233), rgb(45, 28, 26)); stroke: light-dark(rgb(207, 34, 46), rgb(255, 143, 153));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="926" y="125">③ Layout</text><text x="926" y="142">No width / height</text><text x="926" y="159">→ text jumps on load</text></g></g></g><g data-cell-id="c6"><g><path d="M 236 136 L 275.76 136" fill="none" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/><path d="M 283.76 136 L 275.76 140 L 275.76 132 Z" fill="#57606a" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(87, 96, 106), rgb(150, 157, 166)); stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/></g></g><g data-cell-id="c7"><g><path d="M 506 136 L 545.76 136" fill="none" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/><path d="M 553.76 136 L 545.76 140 L 545.76 132 Z" fill="#57606a" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(87, 96, 106), rgb(150, 157, 166)); stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/></g></g><g data-cell-id="c8"><g><path d="M 776 136 L 815.76 136" fill="none" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/><path d="M 823.76 136 L 815.76 140 L 815.76 132 Z" fill="#57606a" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(87, 96, 106), rgb(150, 157, 166)); stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><rect x="286" y="246" width="220" height="80" rx="9.6" ry="9.6" fill="#dafbe1" stroke="#1a7f37" pointer-events="all" style="fill: light-dark(rgb(218, 251, 225), rgb(8, 37, 14)); stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="396" y="283.5">Fix: resize to what the</text><text x="396" y="300.5">screen needs + AVIF/WebP</text></g></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><rect x="556" y="246" width="220" height="80" rx="9.6" ry="9.6" fill="#dafbe1" stroke="#1a7f37" pointer-events="all" style="fill: light-dark(rgb(218, 251, 225), rgb(8, 37, 14)); stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="666" y="283.5">Fix: 1200 × 800 for a 2× screen</text><text x="666" y="300.5">→ only 3.84 MB decoded</text></g></g></g><g data-cell-id="c11"><g transform="translate(0.5,0.5)"><rect x="826" y="246" width="200" height="80" rx="9.6" ry="9.6" fill="#dafbe1" stroke="#1a7f37" pointer-events="all" style="fill: light-dark(rgb(218, 251, 225), rgb(8, 37, 14)); stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="926" y="283.5">Fix: add width + height</text><text x="926" y="300.5">→ space is reserved</text></g></g></g><g data-cell-id="c12"><g><path d="M 396 196 L 396 235.76" fill="none" stroke="#1a7f37" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/><path d="M 396 243.76 L 392 235.76 L 400 235.76 Z" fill="#1a7f37" stroke="#1a7f37" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(26, 127, 55), rgb(87, 174, 112)); stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/></g></g><g data-cell-id="c13"><g><path d="M 666 196 L 666 235.76" fill="none" stroke="#1a7f37" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/><path d="M 666 243.76 L 662 235.76 L 670 235.76 Z" fill="#1a7f37" stroke="#1a7f37" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(26, 127, 55), rgb(87, 174, 112)); stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/></g></g><g data-cell-id="c14"><g><path d="M 926 196 L 926 235.76" fill="none" stroke="#1a7f37" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/><path d="M 926 243.76 L 922 235.76 L 930 235.76 Z" fill="#1a7f37" stroke="#1a7f37" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(26, 127, 55), rgb(87, 174, 112)); stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/></g></g></g></g></g></svg>