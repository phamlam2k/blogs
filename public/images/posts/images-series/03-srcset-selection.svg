<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: light-dark(#FFFFFF, #121212); color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="910px" height="470px" viewBox="0 0 910 470"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c1"><g><rect x="16" y="16" width="860" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#24292F" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="446" y="38.5">A phone: viewport 390px, device pixel ratio 3</text></g></g></g><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="16" y="66" width="270" height="130" rx="15.6" ry="15.6" fill="#ddf4ff" stroke="#0969da" pointer-events="all" style="fill: light-dark(rgb(221, 244, 255), rgb(14, 34, 43)); stroke: light-dark(rgb(9, 105, 218), rgb(86, 168, 255));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="151" y="111.5">① Match sizes (first match wins)</text><text x="151" y="128.5">(min-width: 1024px) 400px  ✗</text><text x="151" y="145.5">(min-width: 640px) 50vw  ✗</text><text x="151" y="162.5">100vw  ✓  → slot = 390px</text></g></g></g><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><rect x="326" y="66" width="240" height="130" rx="15.6" ry="15.6" fill="#ddf4ff" stroke="#0969da" pointer-events="all" style="fill: light-dark(rgb(221, 244, 255), rgb(14, 34, 43)); stroke: light-dark(rgb(9, 105, 218), rgb(86, 168, 255));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="446" y="120">② Multiply by DPR</text><text x="446" y="137">390px × 3</text><text x="446" y="154">= 1170 pixels needed</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="606" y="66" width="270" height="130" rx="15.6" ry="15.6" fill="#ddf4ff" stroke="#0969da" pointer-events="all" style="fill: light-dark(rgb(221, 244, 255), rgb(14, 34, 43)); stroke: light-dark(rgb(9, 105, 218), rgb(86, 168, 255));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="741" y="120">③ Pick from srcset</text><text x="741" y="137">the smallest file</text><text x="741" y="154">that is at least 1170px wide</text></g></g></g><g data-cell-id="c5"><g><path d="M 286 131 L 315.76 131" fill="none" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/><path d="M 323.76 131 L 315.76 135 L 315.76 127 Z" fill="#57606a" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(87, 96, 106), rgb(150, 157, 166)); stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/></g></g><g data-cell-id="c6"><g><path d="M 566 131 L 595.76 131" fill="none" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/><path d="M 603.76 131 L 595.76 135 L 595.76 127 Z" fill="#57606a" stroke="#57606a" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(87, 96, 106), rgb(150, 157, 166)); stroke: light-dark(rgb(87, 96, 106), rgb(150, 157, 166));"/></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><rect x="16" y="256" width="200" height="80" rx="9.6" ry="9.6" fill="#ffffff" stroke="#d0d7de" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(208, 215, 222), rgb(48, 54, 60));"/></g><g><g fill="#8C959F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(140, 149, 159), rgb(103, 111, 120));"><text x="116" y="293.5">card-400.jpg  (400w)</text><text x="116" y="310.5">too small</text></g></g></g><g data-cell-id="c8"><g transform="translate(0.5,0.5)"><rect x="241" y="256" width="200" height="80" rx="9.6" ry="9.6" fill="#ffffff" stroke="#d0d7de" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(208, 215, 222), rgb(48, 54, 60));"/></g><g><g fill="#8C959F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(140, 149, 159), rgb(103, 111, 120));"><text x="341" y="293.5">card-800.jpg  (800w)</text><text x="341" y="310.5">too small</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><rect x="466" y="256" width="200" height="80" rx="9.6" ry="9.6" fill="#dafbe1" stroke="#1a7f37" pointer-events="all" style="fill: light-dark(rgb(218, 251, 225), rgb(8, 37, 14)); stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/></g><g><g fill="#24292F" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="566" y="293.5">card-1200.jpg  (1200w)</text><text x="566" y="310.5">✓ chosen</text></g></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><rect x="691" y="256" width="185" height="80" rx="9.6" ry="9.6" fill="#ffffff" stroke="#d0d7de" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(208, 215, 222), rgb(48, 54, 60));"/></g><g><g fill="#8C959F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(140, 149, 159), rgb(103, 111, 120));"><text x="783.5" y="293.5">card-1600.jpg  (1600w)</text><text x="783.5" y="310.5">more than needed</text></g></g></g><g data-cell-id="c11"><g><path d="M 741 196 L 741 216 Q 741 226 731 226 L 576 226 Q 566 226 566 235.88 L 566 245.76" fill="none" stroke="#1a7f37" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/><path d="M 566 253.76 L 562 245.76 L 570 245.76 Z" fill="#1a7f37" stroke="#1a7f37" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(26, 127, 55), rgb(87, 174, 112)); stroke: light-dark(rgb(26, 127, 55), rgb(87, 174, 112));"/></g></g><g data-cell-id="c12"><g transform="translate(0.5,0.5)"><rect x="16" y="366" width="860" height="70" rx="8.4" ry="8.4" fill="#ffebe9" stroke="#cf222e" pointer-events="all" style="fill: light-dark(rgb(255, 235, 233), rgb(45, 28, 26)); stroke: light-dark(rgb(207, 34, 46), rgb(255, 143, 153));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="446" y="398.5">No sizes attribute? The browser assumes 100vw.</text><text x="446" y="415.5">On a 1440px laptop at 2× that is 2880px needed → it downloads the biggest file every time.</text></g></g></g></g></g></g></svg>