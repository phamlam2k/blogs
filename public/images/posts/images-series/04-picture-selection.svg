44, 255), rgb(14, 34, 43)); stroke: light-dark(rgb(9, 105, 218), rgb(86, 168, 255));"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 47), rgb(199, 203, 208));"><text x="376" y="535">The first &lt;source&gt; the browser can use wins → list the best format first.</text><text x="376" y="552">The &lt;img&gt; is required: it is what actually renders, and it carries</text><text x="376" y="569">alt, width, height, loading and fetchpriority for every source.</text></g></g></g></g></g></g></svg>